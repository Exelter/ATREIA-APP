name: Tests

# Runs on every push to main and on every pull request: the Windows app must build, and its self-checks must pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Client/AionDPS.csproj -c Release --nologo -o out
      # The game's pictures are not in the repository: the image pack the app downloads, from atreia.app, unpacked into the build for the checks.
      - name: Game pictures
        shell: pwsh
        run: pwsh Tools/release/images.ps1 -Dir out
      # The app's own checks (recorded game frames, no game or Npcap needed). A failed check fails this job; each failed line becomes an
      # error on the run's page, so a red run says which check broke.
      - name: Self-checks
        shell: pwsh
        timeout-minutes: 20
        run: pwsh Tools/release/selftest.ps1 -Dir out

  release-layout:
    name: Release layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # A whole release built the way a real one is, by the same script (Tools/release/build-release.ps1) the release workflow and the owner's PC run:
      # published with the .NET runtime in its own folder, the self-checks in it (and that it ran on its own runtime, not the one installed on the
      # machine), then packed with Velopack. Nothing is put anywhere; no delta (it would fetch the last release from atreia.app every time).
      - name: Build a release like a real one
        shell: pwsh
        timeout-minutes: 40
        run: pwsh Tools/release/build-release.ps1 -Version 1.0.0 -Out releases -NoDelta
