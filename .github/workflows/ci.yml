name: Tests

# Runs on every push to main and on every pull request: the Windows app must build, and its self-checks must pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Client/AionDPS.csproj -c Release --nologo -o out
      # The game's pictures are not in the repository: the image pack the app downloads, from atreia.app, unpacked into the build for the checks.
      - name: Game pictures
        shell: pwsh
        run: pwsh Tools/release/images.ps1 -Dir out
      # The app's own checks (recorded game frames, no game or Npcap needed). A failed check fails this job; each failed line becomes an
      # error on the run's page, so a red run says which check broke.
      - name: Self-checks
        shell: pwsh
        timeout-minutes: 20
        run: pwsh Tools/release/selftest.ps1 -Dir out

  release-layout:
    name: Release layout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # A whole release built the way a real one is, by the same script (Tools/release/build-release.ps1) the release workflow and the owner's PC run:
      # published with the .NET runtime in its own folder, the self-checks in it (and that it ran on its own runtime, not the one installed on the
      # machine), then packed with Velopack. Nothing is put anywhere; no delta (it would fetch the last release from atreia.app every time).
      - name: Build a release like a real one
        shell: pwsh
        timeout-minutes: 40
        run: pwsh Tools/release/build-release.ps1 -Version 1.0.0 -Out releases -NoDelta
      # The installer players download, run the way a player would but without the clicks: the setup wizard (silent here) runs Velopack's installer,
      # and the app must then be in its place.
      - name: Install it
        shell: pwsh
        run: |
          $p = Start-Process releases/Atreia-App-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/LOG=wizard.log' -Wait -PassThru
          $info = (Get-Item releases/Atreia-App-Setup.exe).VersionInfo
          "Installer: $($info.FileDescription), $($info.ProductName) $($info.ProductVersion) by $($info.CompanyName); exit code $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA 'AtreiaApp\current\AtreiaApp.exe'
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) {
            if (Test-Path wizard.log) { Get-Content wizard.log -Tail 40 }
            $velopack = Join-Path $env:TEMP 'Atreia-App-install.log'
            if (Test-Path $velopack) { Get-Content $velopack -Tail 40 }
            throw 'The installer did not install the app.'
          }
          "Installed: $exe"
