name: Item icons

# Fetches the icons of the items the other icon sets leave out (souls, soulstones, materials …) from NCSOFT's public item data. The pictures are not kept
# in this repository: the run's "item-icons" artifact holds items/more and items/more_icons.json. The pictures go into the image pack on atreia.app (the
# site's tools/app-images.mjs), more_icons.json into Client/assets/aion2/items.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/item-icons.yml", "Tools/item-icons/fetch_item_icons.py"]

permissions:
  contents: read

concurrency:
  group: item-icons
  cancel-in-progress: true

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The icons the image pack already has are not fetched again: the pack is unpacked first.
      - name: Unpack the image pack
        run: |
          index=https://atreia.app/app/updates/images.json
          curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors -A AtreiaApp-checks -o images.json "$index"
          url=$(jq -r 'if .url then .url else "https://atreia.app/app/updates/" + .file end' images.json)
          curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors -A AtreiaApp-checks -o images.zip "$url"
          echo "$(jq -r .sha256 images.json)  images.zip" | sha256sum -c -
          unzip -q -o images.zip -d Client/assets
      - name: Fetch the icons
        run: |
          pip install -q pillow
          python3 Tools/item-icons/fetch_item_icons.py Client/assets/aion2
          du -sh Client/assets/aion2/items/more
          ls Client/assets/aion2/items/more | wc -l
      - name: Keep them as the run's artifact
        uses: actions/upload-artifact@v6
        with:
          name: item-icons
          retention-days: 7
          path: |
            Client/assets/aion2/items/more
            Client/assets/aion2/items/more_icons.json
