name: Linux

# The Linux app (Linux/): built on Linux, its checks run there (the Windows app's checks that need no window, then the Linux parts), pictures of its
# meter drawn without a screen, and the download players unpack (atreia-app-linux-x64-<version>.tar.gz) kept with the run. The Linux app compiles the
# Windows app's own files (Client/), so a change there runs this too: the Linux app must keep building.
on:
  push:
    branches: [main, cross-platform]
    paths: ["Linux/**", "Client/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["Linux/**", "Client/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, checks and download
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # The version of the last release: the site takes uploads from the current version only, the same for both apps.
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          dotnet publish Linux/AtreiaApp.Linux.csproj -c Release -r linux-x64 --self-contained true --nologo
          -p:Version=${{ steps.version.outputs.version }} -o out/atreia-app
      # The download, before anything else goes into the folder (the game's pictures below are for the checks only: they are NCSOFT's and never shipped).
      - name: Download for players
        run: |
          chmod +x out/atreia-app/AtreiaApp out/atreia-app/install.sh out/atreia-app/uninstall.sh
          tar -C out -czf atreia-app-linux-x64-${{ steps.version.outputs.version }}.tar.gz atreia-app
          ls -l atreia-app-linux-x64-*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: atreia-app-linux-x64-${{ steps.version.outputs.version }}
          path: atreia-app-linux-x64-*.tar.gz
          retention-days: 30
      - name: libpcap for the checks
        run: sudo apt-get update -q && sudo apt-get install -y -q libpcap-dev
      # The image pack the app downloads, from atreia.app, unpacked into the build for the checks and the pictures.
      - name: Game pictures
        run: |
          set -eu
          index=$(curl -fsSL --retry 4 --retry-delay 10 -A AtreiaApp-checks https://atreia.app/app/updates/images.json)
          url=$(printf '%s' "$index" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("url") or "https://atreia.app/app/updates/" + d["file"])')
          sha=$(printf '%s' "$index" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"].lower())')
          curl -fsSL --retry 4 --retry-delay 10 -A AtreiaApp-checks -o /tmp/images.zip "$url"
          echo "$sha  /tmp/images.zip" | sha256sum -c -
          unzip -q -o /tmp/images.zip -d out/atreia-app/assets
          echo "$(find out/atreia-app/assets -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.webp' \) | wc -l) pictures in the build"
          ls out/atreia-app/assets/classes/icons | head -20
      - name: Self-checks
        run: |
          set +e
          out/atreia-app/AtreiaApp selftest > selftest.txt 2> selftest-errors.txt
          code=$?
          cat selftest.txt
          if [ -s selftest-errors.txt ]; then echo "--- errors ---"; cat selftest-errors.txt; fi
          if [ $code -ne 0 ] || ! grep -q '\[selftest\] ALL CHECKS PASSED' selftest.txt; then
            awk '/^\[selftest\]/{head=$0} /(^|[^A-Za-z])False([^A-Za-z]|$)/{print "::error title=Self-check failed::" head " " $0}' selftest.txt | head -25
            echo "::error::The self-checks failed (exit $code)."
            exit 1
          fi
      - name: Capture check
        run: out/atreia-app/AtreiaApp capture-check
      # The capture for real, the way a player's install runs it: the program given the right to read the network (install.sh's setcap), started as the
      # user, reading made-up game traffic on this machine (Linux/packaging/ci/game-traffic.py: the real capture's damage frames from port 13328).
      - name: The capture reads game traffic
        run: |
          set -eu
          sudo setcap cap_net_raw,cap_net_admin=eip out/atreia-app/AtreiaApp
          getcap out/atreia-app/AtreiaApp
          out/atreia-app/AtreiaApp --version || echo "::warning::--version with the rights failed ($?)"
          out/atreia-app/AtreiaApp listen 14 > listen.txt 2>&1 &
          listener=$!
          sleep 5
          python3 Linux/packaging/ci/game-traffic.py
          code=0; wait $listener || code=$?
          cat listen.txt
          [ $code -eq 0 ] || { echo "::error::listen ended with $code"; exit 1; }
          hits=$(grep -c '^event:' listen.txt || true)
          if [ "$hits" -lt 4 ] || ! grep -q 'Keen Strike 588 crit' listen.txt || ! grep -q 'Blood Absorption 65 heal' listen.txt; then
            echo "::error::The capture read $hits hit(s) of the made-up game traffic (20 sent)."
            exit 1
          fi
          sudo setcap -r out/atreia-app/AtreiaApp
      - name: Pictures of the meter
        run: |
          set -eu
          mkdir -p screens
          for scene in meter raid heal taken all callout buffs stagger stagger-failed grind dummy bar waiting permission; do
            out/atreia-app/AtreiaApp render "screens/linux-$scene.png" "$scene"
          done
          # in the log too (collapsed), for a look without downloading the run's files
          for f in screens/*.png; do
            echo "::group::$f (base64)"
            base64 -w 0 "$f"; echo
            echo "::endgroup::"
          done
      # The real window on an X server (no screen: Xvfb), locked in place and letting the clicks through, for a few seconds: it must open and keep running,
      # and its picture is kept. Its own data folder, so the run starts like a first start.
      - name: The window on an X server
        run: |
          set -eu
          sudo apt-get install -y -q xvfb x11-apps imagemagick > /dev/null
          home=$(mktemp -d)
          export XDG_CONFIG_HOME="$home/.config"
          mkdir -p "$home/.config/AtreiaApp"
          echo '{"X": 40, "Y": 40, "Locked": true, "Topmost": true}' > "$home/.config/AtreiaApp/linux-window.json"
          echo '{"CompactClickThrough": true}' > "$home/.config/AtreiaApp/meter-settings.json"
          HOME="$home" xvfb-run -a -s "-screen 0 1100x700x24" sh -c '
            out/atreia-app/AtreiaApp > window.log 2>&1 & app=$!
            sleep 10
            xwd -root -silent | convert xwd:- screens/linux-x11.png
            if kill -0 $app 2>/dev/null; then kill $app; echo "the window ran for 10 seconds"; else echo "::error::the app ended by itself"; cat window.log; exit 1; fi'
          if [ -s "$home/.config/AtreiaApp/crash.log" ]; then echo "::error::crash.log was written"; cat "$home/.config/AtreiaApp/crash.log"; exit 1; fi
          cat "$home/.config/AtreiaApp/linux.log"
          # letting the clicks through: only the bar's buttons take the mouse, the rest of the clicks go to the game
          grep -q "input region: the bar's buttons alone" "$home/.config/AtreiaApp/linux.log" || { echo "::error::the meter did not let the clicks through"; exit 1; }
          echo "::group::screens/linux-x11.png (base64)"; base64 -w 0 screens/linux-x11.png; echo; echo "::endgroup::"
      # Every button of the window clicked on an X server with a window manager (openbox: moving a window is the window manager's job), the game's
      # made-up traffic giving it lines (Linux/packaging/ci/ui-test.py): the pill's measures and views, the scope switch, the reset, moving it by its head,
      # the lock, the grip (wider, with Ctrl bigger, a double-click back), the menu's pause, open world, always on top, the clicks through, and quit.
      - name: Every button of the window
        run: |
          set -eu
          sudo apt-get install -y -q xdotool openbox > /dev/null
          sudo setcap cap_net_raw,cap_net_admin=eip out/atreia-app/AtreiaApp
          home=$(mktemp -d)
          export XDG_CONFIG_HOME="$home/.config"
          mkdir -p "$home/.config/AtreiaApp"
          echo '{"X": 60, "Y": 60, "Locked": false, "Topmost": true}' > "$home/.config/AtreiaApp/linux-window.json"
          # the fold off: the body shows the made-up traffic's lines without a boss fight
          echo '{"MeterFoldIdle": false}' > "$home/.config/AtreiaApp/meter-settings.json"
          code=0
          HOME="$home" xvfb-run -a -s "-screen 0 1280x800x24" sh -c '
            openbox > /dev/null 2>&1 &
            sleep 1
            python3 Linux/packaging/ci/ui-test.py out/atreia-app/AtreiaApp "$XDG_CONFIG_HOME/AtreiaApp/linux.log" screens' || code=$?
          sudo setcap -r out/atreia-app/AtreiaApp
          echo "::group::linux.log"; cat "$home/.config/AtreiaApp/linux.log"; echo "::endgroup::"
          if [ -s "$home/.config/AtreiaApp/crash.log" ]; then echo "::error::crash.log was written"; cat "$home/.config/AtreiaApp/crash.log"; exit 1; fi
          for f in screens/linux-ui-*.png; do
            echo "::group::$f (base64)"; base64 -w 0 "$f"; echo; echo "::endgroup::"
          done
          [ $code -eq 0 ] || { echo "::error::a button of the window did not work (above)"; exit 1; }
      # A player's way, end to end: the download unpacked in a new home, install.sh (with its sudo setcap), then the installed command started on an X
      # server while the made-up game traffic plays. The meter must open with the right to read the network, find the game's traffic, fetch the game's
      # pictures on this first start and keep running; then uninstall.sh takes it all away again.
      - name: A player's install, end to end
        run: |
          set -eu
          home=$(mktemp -d)
          mkdir "$home/Downloads"
          tar -C "$home/Downloads" -xzf atreia-app-linux-x64-${{ steps.version.outputs.version }}.tar.gz
          (cd "$home/Downloads/atreia-app" && env -u XDG_DATA_HOME HOME="$home" ./install.sh)
          app="$home/.local/share/atreia-app/AtreiaApp"
          getcap "$app" | grep -q 'cap_net_admin,cap_net_raw=eip' || { echo "::error::install.sh did not give the app the right to read the network"; getcap "$app"; exit 1; }
          [ -f "$home/.local/share/applications/atreia-app.desktop" ] || { echo "::error::no menu entry"; exit 1; }
          HOME="$home" "$home/.local/bin/atreia-app" --version
          export XDG_CONFIG_HOME="$home/.config"
          mkdir -p "$home/.config/AtreiaApp"
          echo '{"X": 40, "Y": 40, "Locked": false, "Topmost": true}' > "$home/.config/AtreiaApp/linux-window.json"
          HOME="$home" xvfb-run -a -s "-screen 0 1100x700x24" sh -c '
            "$HOME/.local/bin/atreia-app" > installed.log 2>&1 & app=$!
            sleep 6
            python3 Linux/packaging/ci/game-traffic.py
            sleep 3
            xwd -root -silent | convert xwd:- screens/linux-installed.png
            waited=0
            while [ ! -f "$HOME/.config/AtreiaApp/images/pack.json" ] && [ $waited -lt 120 ]; do sleep 2; waited=$((waited + 2)); done
            sleep 2
            xwd -root -silent | convert xwd:- screens/linux-installed-pictures.png
            if kill -0 $app 2>/dev/null; then kill $app; echo "the installed app ran"; else echo "::error::the installed app ended by itself"; cat installed.log; exit 1; fi'
          log="$home/.config/AtreiaApp/linux.log"
          cat "$log"
          if [ -s "$home/.config/AtreiaApp/crash.log" ]; then echo "::error::crash.log was written"; cat "$home/.config/AtreiaApp/crash.log"; exit 1; fi
          grep -q "capture rights: Granted" "$log" || { echo "::error::the installed app may not read the network"; exit 1; }
          grep -q "capture: Connected - Aion 2: Game traffic from 127.0.0.1:13328" "$log" || { echo "::error::the installed app did not find the game's traffic"; exit 1; }
          if [ -f "$home/.config/AtreiaApp/images/pack.json" ]; then echo "the game's pictures came: $(cat "$home/.config/AtreiaApp/images/pack.json")"; else echo "::warning::the game's pictures did not come within two minutes"; fi
          for f in screens/linux-installed.png screens/linux-installed-pictures.png; do
            echo "::group::$f (base64)"; base64 -w 0 "$f"; echo; echo "::endgroup::"
          done
          env -u XDG_DATA_HOME HOME="$home" "$home/.local/share/atreia-app/uninstall.sh"
          for left in "$home/.local/share/atreia-app" "$home/.local/bin/atreia-app" "$home/.local/share/applications/atreia-app.desktop"; do
            [ ! -e "$left" ] || { echo "::error::uninstall.sh left $left"; exit 1; }
          done
          echo "uninstall.sh removed the app"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-screens
          path: screens/*.png
          retention-days: 14
