name: Build a release for atreia.app

# Two ways to start it:
# - Actions > "Build a release for atreia.app" > Run workflow. Leave the version empty for the next one (1.21.0 -> 1.21.1), or type it ("1.22.0", or
#   "1.22.0-Beta" for a test release). The release is built from the branch picked (main); when it passed its checks, the tag "v<version>" is put on
#   the commit it was built from.
# - Pushing a tag "vX.Y.Z" (or "X.Y.Z"): the release of that tag.
#
# The app's own version number is set from the version given, so the title bar always shows the version that was released, whatever the project file
# said. A version with a suffix ("1.21.0-alpha.1") is a test release. Test versions are compared letter by letter, capitals before small letters: after
# "1.21.0-Beta" comes "1.21.0-Beta.2" (not "1.21.0-alpha.2", which counts as older, so an installed test copy would never be offered it).
#
# Releases are not published on GitHub (9 November 2026): the installer and the updates are on the website. This builds the release, runs the checks,
# and puts it straight on atreia.app: into the site's file storage (Cloudflare R2, bucket "atreia-app"), which the site serves its downloads and the
# app's updates from (the site's src/gate.js, appFile). It needs the repository secrets R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY.
# Without them, the result is only kept as the run's artifact ("Atreia-App-v<version>"), to put on the site by hand: drag it onto the site folder's
# APP-RELEASE.bat (node tools/app-release.mjs <folder>), then DEPLOY.
#
# The installer becomes https://atreia.app/download/Atreia-App-Setup.exe (a test release: Atreia-App-test-Setup.exe), the update index and packages
# go to https://atreia.app/app/updates/ (Client/Brand.cs UpdatesUrl), together with the update notes (updates.json).
on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty: the next one, e.g. 1.21.0 -> 1.21.1; with a suffix like 1.22.0-Beta: a test release)"
        required: false

permissions:
  contents: write # only to put the tag on the commit of a release started by hand

# a release is never built twice at once (two would both write the update index)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT#v}"
            if [ -z "$version" ]; then
              # the next one after the newest released version (its tag, with or without the "v"): 1.21.0 -> 1.21.1
              last=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" | sed -E 's#.*refs/tags/v?##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
              IFS=. read -r major minor patch <<< "${last:-1.21.0}"
              version="$major.$minor.$((patch + 1))"
              echo "No version given: releasing $version (the newest so far: ${last:-none})."
            fi
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::\"$INPUT\" is no version: write it like 1.21.0, or 1.21.0-alpha.1 for a test release."
              exit 1
            fi
            echo "name=v$version" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tagit=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "tagit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}

      # The assembly version is plain major.minor.build: everything from the first "-" goes ("v1.21.0-alpha.1" builds as 1.21.0).
      #
      # A tag with a suffix is a release for testers: it is packed under its full version on its own Velopack channel ("test", releases.test.json),
      # so installed copies on the normal channel ("stable", releases.stable.json) never see it as an update, and the final 1.21.0 stays free.
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          version="${TAG#v}"
          full="$version"
          version="${version%%-*}"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if [ "$full" != "$version" ]; then
            echo "pack=$full" >> "$GITHUB_OUTPUT"
            echo "channel=test" >> "$GITHUB_OUTPUT"
          else
            echo "pack=$version" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Everything up to the files for atreia.app, by the same script the owner's PC runs without GitHub (Tools/release/build-release.ps1, from the
      # website's APP-BUILD.bat): the app published in its installed layout, its self-checks with the game's pictures from atreia.app (a failed check
      # stops the release: nothing is packed, each failed line an error on the run's page), the release before it from atreia.app for a small delta
      # package, Velopack (the installer, the packages, releases.<channel>.json, the index the installed app reads), the installer named after the
      # app (Atreia-App-Setup.exe; a test release Atreia-App-test-Setup.exe), the update notes (updates.json) and SHA256SUMS.txt beside them.
      - name: Build the release
        shell: pwsh
        timeout-minutes: 45
        run: pwsh Tools/release/build-release.ps1 -Version ${{ steps.version.outputs.pack }} -Out releases

      - name: The installer
        id: installer
        shell: pwsh
        run: |
          $ch = '${{ steps.version.outputs.channel }}'
          $name = if ($ch -eq 'stable') { 'Atreia-App-Setup.exe' } else { "Atreia-App-$ch-Setup.exe" }
          if (-not (Test-Path "releases/$name")) { throw "releases/$name is missing." }
          "path=releases/$name" >> $env:GITHUB_OUTPUT

      # Scans the installer with VirusTotal. Skipped when the VT_API_KEY secret is not set. An unreachable VirusTotal never blocks a release (warning
      # only); a verdict does: 5 or more malicious/suspicious engines, or any of the big vendors listed below, fails the run so the release is never
      # handed out. A handful of hits from small engines is normal for a new unsigned program that reads network traffic -- those are only reported.
      - name: Scan the installer with VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        shell: bash
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "VT_API_KEY not set, skipping the VirusTotal scan."; exit 0; fi
          api=https://www.virustotal.com/api/v3
          big='^(Microsoft|Kaspersky|ESET-NOD32|BitDefender|Sophos|Symantec|McAfee|CrowdStrike|Avast|AVG)$'
          skip() { echo "::warning::VirusTotal scan failed, the release continues without it: $*"; exit 0; }
          sha=$(sha256sum "$INSTALLER" | cut -d' ' -f1)

          # The report of a file is looked up by its hash; it exists (with results) once VirusTotal finished the scan.
          lookup() {
            code=$(curl -sS -o vt_file.json -w '%{http_code}' -H "x-apikey: $VT_API_KEY" "$api/files/$sha") || return 1
            [ "$code" = 200 ] && [ "$(jq '.data.attributes.last_analysis_stats | .malicious + .suspicious + .harmless + .undetected' vt_file.json)" -gt 0 ]
          }

          if ! lookup; then
            code=$(curl -sS -o vt_url.json -w '%{http_code}' -H "x-apikey: $VT_API_KEY" "$api/files/upload_url") || skip "upload_url request"
            [ "$code" = 200 ] || skip "upload_url HTTP $code: $(head -c 300 vt_url.json)"
            code=$(curl -sS -o vt_upload.json -w '%{http_code}' -H "x-apikey: $VT_API_KEY" -F "file=@$INSTALLER" "$(jq -r .data vt_url.json)") || skip "upload request"
            # 409: already submitted a moment ago (a re-run) -- just wait for that scan.
            [ "$code" = 200 ] || [ "$code" = 409 ] || skip "upload HTTP $code: $(head -c 300 vt_upload.json)"
            for i in $(seq 1 40); do
              sleep 30
              lookup && break
            done
            lookup || skip "analysis did not finish in time"
          fi

          hits=$(jq '.data.attributes.last_analysis_stats | .malicious + .suspicious' vt_file.json)
          total=$(jq '.data.attributes.last_analysis_stats | .malicious + .suspicious + .harmless + .undetected' vt_file.json)
          flagged=$(jq -r '[.data.attributes.last_analysis_results[] | select(.category == "malicious" or .category == "suspicious") | .engine_name] | join(", ")' vt_file.json)
          bigflagged=$(jq -r --arg re "$big" '[.data.attributes.last_analysis_results[] | select((.category == "malicious" or .category == "suspicious") and (.engine_name | test($re))) | .engine_name] | join(", ")' vt_file.json)
          link="https://www.virustotal.com/gui/file/$sha"

          summary="### VirusTotal: $hits / $total engines flag the installer"$'\n'"$link"
          [ -n "$flagged" ] && summary="$summary"$'\n'"Flagged by: $flagged"
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$hits" -ge 5 ] || [ -n "$bigflagged" ]; then
            echo "::error::VirusTotal verdict too bad ($hits hits, big vendors: $bigflagged). Not handing it out. $link"
            exit 1
          fi

      # Straight onto atreia.app: the packages first, then the installer, the update index and the notes last, so an installed app never reads an index
      # that names a file not there yet. The site serves these from its file storage before its own files (src/gate.js, appFile).
      - name: Put the release on atreia.app
        if: env.R2_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        shell: pwsh
        run: |
          $bucket = 's3://atreia-app'
          function Put([string]$file, [string]$key, [string]$type) {
            aws s3 cp $file "$bucket/$key" --endpoint-url $env:R2_ENDPOINT --content-type $type --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw "The upload of $key failed ($LASTEXITCODE)." }
            "  $key"
          }
          $files = Get-ChildItem releases -File
          foreach ($f in $files | Where-Object { $_.Extension -eq '.nupkg' }) { Put $f.FullName "updates/$($f.Name)" 'application/octet-stream' }
          $installer = Get-Item '${{ steps.installer.outputs.path }}'
          Put $installer.FullName "download/$($installer.Name)" 'application/vnd.microsoft.portable-executable'
          foreach ($f in $files | Where-Object { $_.Name -match '^(releases|assets)\..+\.json$' }) { Put $f.FullName "updates/$($f.Name)" 'application/json' }
          foreach ($f in $files | Where-Object { $_.Name -clike 'RELEASES*' }) { Put $f.FullName "updates/$($f.Name)" 'text/plain' }
          Put (Join-Path releases 'updates.json') 'updates/updates.json' 'application/json'
          "Version ${{ steps.version.outputs.pack }} is on atreia.app now: installed apps find it at their next check."
          # the packages of this channel the new index no longer names (the releases before the previous one): nothing reads them any more
          $channel = '${{ steps.version.outputs.channel }}'
          $named = @((Get-Content (Join-Path releases "releases.$channel.json") -Raw | ConvertFrom-Json).Assets | ForEach-Object { $_.FileName })
          $stored = @(aws s3 ls "$bucket/updates/" --endpoint-url $env:R2_ENDPOINT | ForEach-Object { ($_ -split '\s+')[-1] } |
            Where-Object { $_ -like "*-$channel-*.nupkg" })
          foreach ($old in $stored | Where-Object { $named -notcontains $_ }) {
            aws s3 rm "$bucket/updates/$old" --endpoint-url $env:R2_ENDPOINT --only-show-errors
            "  removed updates/$old"
          }

      # The whole release for the website, as the run's artifact: download it from the run's page, unzip it, and run the site's tools/app-release.mjs on
      # the folder (see the top of this file). Not for a test release that is on atreia.app already: the repository is public, so anyone could take the
      # beta from the run's page; the beta is handed to the Contributors by /beta in the Atreia Discord (the site's src/beta.js).
      - name: Keep the release as the run's artifact
        if: steps.version.outputs.channel == 'stable' || env.R2_ENDPOINT == ''
        uses: actions/upload-artifact@v6
        with:
          name: Atreia-App-${{ steps.tag.outputs.name }}
          path: releases/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: What to do with it
        shell: bash
        run: |
          {
            echo "### Atreia App ${{ steps.tag.outputs.name }} (channel ${{ steps.version.outputs.channel }})"
            if [ -n "$R2_ENDPOINT" ] && [ "${{ steps.version.outputs.channel }}" != "stable" ]; then
              echo "It is on atreia.app already, for testers only: the Contributors get it with /beta in the Atreia Discord, and installed betas find it at their next update check."
            elif [ -n "$R2_ENDPOINT" ]; then
              echo "It is on atreia.app already: installed apps find it at their next update check, and the download button gives it."
            else
              echo "Download the artifact **Atreia-App-${{ steps.tag.outputs.name }}** below and drag it onto APP-RELEASE.bat in the website's folder, then run DEPLOY."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A release started by hand: its tag on the commit it was built from, so the release can be found in the history. (A tag pushed with the workflow's
      # own token starts no further run.) An existing tag of that name is left as it is.
      - name: Tag the commit
        if: steps.tag.outputs.tagit == 'true'
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "The tag $tag exists already: left as it is."
          else
            git tag "$tag" "${{ steps.tag.outputs.ref }}"
            git push origin "refs/tags/$tag"
          fi
